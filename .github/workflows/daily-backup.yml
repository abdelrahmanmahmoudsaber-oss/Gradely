name: Gradely Daily Automated Backup (Zero-Click)

on:
  schedule:
    # Runs automatically every day at 02:00 AM UTC (5:00 AM Cairo local time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions web page

jobs:
  run-backup:
    name: Generate & Send Daily Excel Backup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies (ExcelJS & Supabase)
        run: |
          cd frontend
          npm ci

      - name: 🚀 Run Cloud Backup Engine
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://bbdyexsaqnlremprfmph.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_7lextLm1cEOuRlz4XMiV9w_F01aZaho' }}
          BACKUP_CRON_SECRET: ${{ secrets.BACKUP_CRON_SECRET || 'gradely_backup_cron_sec_7f9a2b8e4c1d6e5a' }}
          BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL || vars.BACKUP_EMAIL }}
          BACKUP_WEBHOOK_URL: ${{ secrets.BACKUP_WEBHOOK_URL || vars.BACKUP_WEBHOOK_URL }}
        run: |
          NODE_PATH=frontend/node_modules node scripts/cron-backup.mjs
