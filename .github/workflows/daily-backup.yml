name: Gradely Daily Automated Backup (Zero-Click)

on:
  schedule:
    # Runs automatically every day at 02:00 AM UTC (5:00 AM Cairo local time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions web page

jobs:
  run-backup:
    name: Generate & Send Daily Excel Backup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Verify Packages
        working-directory: frontend
        run: |
          node -e "require('@supabase/supabase-js'); console.log('supabase-js OK')"
          node -e "require('exceljs'); console.log('exceljs OK')"

      - name: Run Cloud Backup Engine
        env:
          NODE_PATH: ${{ github.workspace }}/frontend/node_modules
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://bbdyexsaqnlremprfmph.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_7lextLm1cEOuRlz4XMiV9w_F01aZaho' }}
          BACKUP_CRON_SECRET: ${{ secrets.BACKUP_CRON_SECRET || 'gradely_backup_cron_sec_7f9a2b8e4c1d6e5a' }}
          BACKUP_EMAIL: ${{ secrets.BACKUP_EMAIL || 'abdo2171999m@gmail.com' }}
          BACKUP_WEBHOOK_URL: ${{ secrets.BACKUP_WEBHOOK_URL || 'https://script.google.com/macros/s/AKfycbykd7LVJ8p0dqrHqW9UUJ04i40qFwRTa0b98YPA1NgXzJ3U0EECa9i-EbiVa70pvHzbiQ/exec' }}
        run: node scripts/cron-backup.cjs


