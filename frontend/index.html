<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#070b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gradely" />
    <meta name="application-name" content="Gradely" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gradely</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #070b14;
        color: #f8fafc;
        font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pre-splash {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #070b14;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: clamp(2rem, 5vh, 3.5rem) 1.25rem;
        box-sizing: border-box;
        overflow: hidden;
      }
      .pre-splash-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        z-index: 2;
      }
      .pre-splash-tile-wrap {
        position: relative;
        margin-bottom: 1.4rem;
      }
      .pre-splash-tile-glow {
        position: absolute;
        inset: -10px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.5) 0%, rgba(99, 102, 241, 0.4) 50%, rgba(7, 11, 20, 0) 75%);
        border-radius: 34px;
        filter: blur(20px);
        opacity: 0.85;
      }
      .pre-splash-tile {
        position: relative;
        width: 92px;
        height: 92px;
        background: linear-gradient(145deg, #131c31 0%, #0a0f1d 100%);
        border-radius: 26px;
        border: 1.5px solid rgba(56, 189, 248, 0.45);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pre-splash-title {
        margin: 0 0 1.6rem 0;
        font-size: clamp(2.4rem, 6vw, 2.9rem);
        font-weight: 900;
        letter-spacing: -0.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      .pre-splash-title .white-txt {
        color: #ffffff;
      }
      .pre-splash-title .purple-txt {
        background: linear-gradient(135deg, #a855f7 0%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .pre-splash-bar {
        width: 210px;
        height: 5px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 1rem;
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
      }
      .pre-splash-bar-inner {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 50%;
        background: linear-gradient(90deg, #38bdf8 0%, #818cf8 60%, #a855f7 100%);
        border-radius: 999px;
        box-shadow: 0 0 12px #38bdf8;
        animation: preSplashProgress 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .pre-splash-status {
        font-size: 0.92rem;
        color: #94a3b8;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .pre-splash-footer-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
        z-index: 2;
        width: 100%;
        max-width: 440px;
      }
      .pre-splash-dev-sep {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        color: #64748b;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 1.2px;
      }
      .pre-splash-dev-line {
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.08);
      }
      .pre-splash-pill {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 10px 18px;
        background: rgba(15, 23, 42, 0.65);
        border: 1.2px solid rgba(56, 189, 248, 0.35);
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        max-width: 96vw;
        box-sizing: border-box;
      }
      .dev-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .avatar-badge {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.72rem;
        font-weight: 900;
        color: #ffffff;
        flex-shrink: 0;
      }
      .avatar-am {
        background: linear-gradient(135deg, #1e40af, #3b82f6);
        border: 1.5px solid #60a5fa;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
      }
      .avatar-mt {
        background: linear-gradient(135deg, #0d9488, #14b8a6);
        border: 1.5px solid #5eead4;
        box-shadow: 0 0 10px rgba(20, 184, 166, 0.5);
      }
      .dev-name {
        font-size: clamp(0.78rem, 2.5vw, 0.88rem);
        font-weight: 700;
        color: #f8fafc;
        white-space: nowrap;
        letter-spacing: 0.2px;
      }
      .dev-divider {
        width: 1px;
        height: 18px;
        background: rgba(255, 255, 255, 0.15);
        flex-shrink: 0;
      }
      @keyframes preSplashProgress {
        0% { left: -50%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-splash">
        <svg
          style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;"
          viewBox="0 0 400 800"
          preserveAspectRatio="none"
        >
          <defs>
            <linearGradient id="preCurveTop" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#d97706" stop-opacity="0.8" />
              <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5" />
              <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.7" />
              <stop offset="100%" stop-color="#1e40af" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="preCurveBottom" x1="100%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
              <stop offset="40%" stop-color="#818cf8" stop-opacity="0.6" />
              <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.5" />
              <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
            </linearGradient>
          </defs>
          <path d="M -60 140 C 60 70, 160 30, 280 -60" stroke="url(#preCurveTop)" stroke-width="2.5" fill="none" opacity="0.75" />
          <path d="M 120 860 C 240 790, 340 730, 460 620" stroke="url(#preCurveBottom)" stroke-width="2.5" fill="none" opacity="0.75" />
        </svg>

        <div style="height: 10px;"></div>

        <div class="pre-splash-center">
          <div class="pre-splash-tile-wrap">
            <div class="pre-splash-tile-glow"></div>
            <div class="pre-splash-tile">
              <svg width="60" height="60" viewBox="0 0 100 100" fill="none">
                <defs>
                  <linearGradient id="preG" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#38bdf8" />
                    <stop offset="50%" stop-color="#60a5fa" />
                    <stop offset="100%" stop-color="#818cf8" />
                  </linearGradient>
                  <linearGradient id="preCap" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f59e0b" />
                    <stop offset="100%" stop-color="#d97706" />
                  </linearGradient>
                </defs>
                <path d="M 52 28 C 36 28 24 40 24 56 C 24 72 36 84 52 84 C 68 84 76 73 76 62 L 52 62 L 52 50 L 88 50 C 89 74 74 94 52 94 C 28 94 12 76 12 56 C 12 34 29 18 52 18 C 63 18 73 22 80 29 L 71 38 C 66 32 59 28 52 28 Z" fill="url(#preG)" />
                <g transform="translate(18, 10) rotate(-16) scale(0.9)">
                  <polygon points="26,4 48,13 26,22 4,13" fill="url(#preCap)" stroke="#fbbf24" stroke-width="1.2" />
                  <path d="M 12 16 L 12 24 C 12 28 40 28 40 24 L 40 16 Z" fill="#b45309" opacity="0.9" />
                  <circle cx="26" cy="13" r="2.2" fill="#fef3c7" />
                  <path d="M 26 13 Q 10 18 8 26" stroke="#fbbf24" stroke-width="1.5" fill="none" />
                  <circle cx="8" cy="27" r="1.8" fill="#f59e0b" />
                </g>
              </svg>
            </div>
          </div>
          <h1 class="pre-splash-title">
            <span class="white-txt">Gradel</span><span class="purple-txt">y</span>
          </h1>
          <div class="pre-splash-bar">
            <div class="pre-splash-bar-inner"></div>
          </div>
          <span class="pre-splash-status">جاري تجهيز بياناتك...</span>
        </div>

        <div class="pre-splash-footer-wrap">
          <div class="pre-splash-dev-sep">
            <div class="pre-splash-dev-line"></div>
            <span>DEVELOPED BY</span>
            <div class="pre-splash-dev-line"></div>
          </div>
          <div class="pre-splash-pill">
            <div class="dev-item">
              <div class="avatar-badge avatar-am">AM</div>
              <span class="dev-name">Eng Abdelrahman Mahmoud</span>
            </div>
            <div class="dev-divider"></div>
            <div class="dev-item">
              <div class="avatar-badge avatar-mt">MT</div>
              <span class="dev-name">Eng Mostafa Tag</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
