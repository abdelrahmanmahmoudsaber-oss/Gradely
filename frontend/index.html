<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0f1d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gradely" />
    <meta name="application-name" content="Gradely" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gradely</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0a0f1d;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pre-splash {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 50% 30%, #1e1b4b 0%, #0a0f1d 70%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: clamp(2rem, 5vh, 3.5rem) 1.5rem;
        box-sizing: border-box;
      }
      .pre-splash-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .pre-splash-logo {
        width: 80px;
        height: 80px;
        background: #141b2d;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
      }
      .pre-splash-logo img {
        width: 52px;
        height: 52px;
        object-fit: contain;
      }
      .pre-splash-title {
        margin: 0 0 0.35rem 0;
        font-size: 2.2rem;
        font-weight: 900;
        background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .pre-splash-sub {
        margin: 0 0 1.5rem 0;
        font-size: 0.95rem;
        color: #94a3b8;
        font-weight: 600;
      }
      .pre-splash-bar {
        width: 180px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 0.8rem;
      }
      .pre-splash-bar-inner {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #6366f1, #a855f7, #38bdf8);
        border-radius: 999px;
        animation: preSplashProgress 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .pre-splash-status {
        font-size: 0.85rem;
        color: #64748b;
        font-weight: 500;
      }
      .pre-splash-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 18px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 14px;
        backdrop-filter: blur(10px);
      }
      .pre-splash-footer-dev {
        color: #818cf8;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .pre-splash-names {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.85rem;
        font-weight: 800;
        color: #f8fafc;
      }
      @keyframes preSplashProgress {
        0% { left: -45%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-splash">
        <div style="height: 10px;"></div>
        <div class="pre-splash-center">
          <div class="pre-splash-logo">
            <img src="/gradely_logo.png" alt="Gradely" />
          </div>
          <h1 class="pre-splash-title">Gradely</h1>
          <p class="pre-splash-sub">المنصة الذكية لإدارة المتابعة الأكاديمية</p>
          <div class="pre-splash-bar">
            <div class="pre-splash-bar-inner"></div>
          </div>
          <span class="pre-splash-status">جاري بدء التشغيل ومزامنة البيانات...</span>
        </div>
        <div class="pre-splash-footer">
          <span class="pre-splash-footer-dev">DEVELOPED WITH DEDICATION BY</span>
          <div class="pre-splash-names">
            <span>• Eng Abdelrahman Mahmoud</span>
            <span>• Eng Mostafa Tag</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
