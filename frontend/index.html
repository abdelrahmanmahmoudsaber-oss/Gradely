<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#070b14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gradely" />
    <meta name="application-name" content="Gradely" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Gradely</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #070b14;
        color: #f8fafc;
        font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .pre-splash {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #070b14;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: clamp(2rem, 5vh, 3.5rem) 16px;
        box-sizing: border-box;
        overflow: hidden;
      }
      .pre-splash-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        z-index: 2;
        max-width: 380px;
        width: 100%;
      }
      .pre-splash-tile-wrap {
        position: relative;
        margin-bottom: 1.25rem;
      }
      .pre-splash-tile-glow {
        position: absolute;
        inset: -12px;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.5) 0%, rgba(99, 102, 241, 0.35) 50%, rgba(7, 11, 20, 0) 75%);
        border-radius: 34px;
        filter: blur(20px);
        opacity: 0.9;
      }
      .pre-splash-tile {
        position: relative;
        width: 94px;
        height: 94px;
        background: linear-gradient(145deg, #131c31 0%, #0a0f1d 100%);
        border-radius: 26px;
        border: 1.5px solid rgba(56, 189, 248, 0.45);
        box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75), inset 0 1px 1px rgba(255, 255, 255, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pre-splash-title {
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        margin-bottom: 0.4rem;
        direction: ltr !important;
        unicode-bidi: isolate !important;
      }
      .pre-splash-title .white-txt {
        font-size: clamp(2.5rem, 6.5vw, 3rem);
        font-weight: 900;
        color: #ffffff;
        letter-spacing: -0.5px;
      }
      .pre-splash-title .cyan-txt {
        font-size: clamp(2.5rem, 6.5vw, 3rem);
        font-weight: 900;
        color: #38bdf8;
        text-shadow: 0 0 16px rgba(56, 189, 248, 0.65);
        letter-spacing: -0.5px;
      }
      .pre-splash-subtitle {
        font-size: 0.68rem;
        letter-spacing: 3.5px;
        color: #64748b;
        font-weight: 800;
        text-transform: uppercase;
        margin-bottom: 2rem;
      }
      .pre-splash-bar {
        width: 220px;
        height: 5px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        margin-bottom: 1rem;
        box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
      }
      .pre-splash-bar-inner {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #38bdf8 0%, #818cf8 60%, #a855f7 100%);
        border-radius: 999px;
        box-shadow: 0 0 14px #38bdf8;
        animation: preSplashProgress 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .pre-splash-status {
        font-size: 0.9rem;
        color: #94a3b8;
        font-weight: 600;
        direction: rtl;
        letter-spacing: 0.2px;
      }
      .pre-splash-footer-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
        z-index: 2;
        width: 100%;
        max-width: 390px;
        box-sizing: border-box;
      }
      .pre-splash-dev-sep {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        color: #475569;
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 2px;
      }
      .pre-splash-dev-line {
        flex: 1;
        height: 1px;
        background: rgba(255, 255, 255, 0.08);
      }
      .pre-splash-pill {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 8px 12px;
        background: rgba(15, 23, 42, 0.7);
        border: 1.2px solid rgba(56, 189, 248, 0.35);
        box-shadow: 0 0 25px rgba(56, 189, 248, 0.12), inset 0 1px 1px rgba(255, 255, 255, 0.12);
        border-radius: 26px;
        backdrop-filter: blur(16px);
        box-sizing: border-box;
        gap: 6px;
        direction: ltr !important;
      }
      .dev-item-mt {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 1 1 0;
        min-width: 0;
        justify-content: flex-start;
      }
      .dev-item-am {
        display: flex;
        align-items: center;
        gap: 7px;
        flex: 1.15 1 0;
        min-width: 0;
        justify-content: flex-start;
      }
      .avatar-badge {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7rem;
        font-weight: 900;
        color: #ffffff;
        flex-shrink: 0;
      }
      .avatar-mt {
        background: linear-gradient(135deg, #0d9488, #14b8a6);
        border: 1.5px solid #5eead4;
        box-shadow: 0 0 8px rgba(20, 184, 166, 0.45);
      }
      .avatar-am {
        background: linear-gradient(135deg, #1e40af, #3b82f6);
        border: 1.5px solid #60a5fa;
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.45);
      }
      .dev-name {
        font-size: clamp(0.72rem, 2.3vw, 0.8rem);
        font-weight: 700;
        color: #f8fafc;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .dev-divider {
        width: 1px;
        height: 16px;
        background: rgba(255, 255, 255, 0.15);
        flex-shrink: 0;
      }
      @keyframes preSplashProgress {
        0% { left: -50%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pre-splash">
        <svg
          style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1;"
          viewBox="0 0 400 800"
          preserveAspectRatio="none"
        >
          <defs>
            <linearGradient id="preCurveTop" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#d97706" stop-opacity="0.7" />
              <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4" />
              <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
            </linearGradient>
            <linearGradient id="preCurveBottom" x1="100%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
              <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
              <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
            </linearGradient>
          </defs>
          <path d="M -80 150 C 40 80, 160 40, 320 -50" stroke="url(#preCurveTop)" stroke-width="2.2" fill="none" opacity="0.7" />
          <path d="M 100 870 C 240 800, 340 730, 480 610" stroke="url(#preCurveBottom)" stroke-width="2.2" fill="none" opacity="0.7" />
        </svg>

        <div style="height: 8px;"></div>

        <div class="pre-splash-center">
          <div class="pre-splash-tile-wrap">
            <div class="pre-splash-tile-glow"></div>
            <div class="pre-splash-tile">
              <svg width="62" height="62" viewBox="0 0 100 100" fill="none">
                <defs>
                  <linearGradient id="preG" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#38bdf8" />
                    <stop offset="45%" stop-color="#60a5fa" />
                    <stop offset="100%" stop-color="#818cf8" />
                  </linearGradient>
                  <linearGradient id="preCap" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f59e0b" />
                    <stop offset="100%" stop-color="#d97706" />
                  </linearGradient>
                </defs>
                <path d="M 52 28 C 36 28 24 40 24 56 C 24 72 36 84 52 84 C 68 84 76 73 76 62 L 52 62 L 52 50 L 88 50 C 89 74 74 94 52 94 C 28 94 12 76 12 56 C 12 34 29 18 52 18 C 63 18 73 22 80 29 L 71 38 C 66 32 59 28 52 28 Z" fill="url(#preG)" />
                <g transform="translate(18, 10) rotate(-16) scale(0.9)">
                  <polygon points="26,4 48,13 26,22 4,13" fill="url(#preCap)" stroke="#fbbf24" stroke-width="1.2" />
                  <path d="M 12 16 L 12 24 C 12 28 40 28 40 24 L 40 16 Z" fill="#b45309" opacity="0.9" />
                  <circle cx="26" cy="13" r="2.2" fill="#fef3c7" />
                  <path d="M 26 13 Q 10 18 8 26" stroke="#fbbf24" stroke-width="1.5" fill="none" />
                  <circle cx="8" cy="27" r="1.8" fill="#f59e0b" />
                </g>
              </svg>
            </div>
          </div>

          <div class="pre-splash-title" dir="ltr">
            <span class="white-txt">Gradel</span><span class="cyan-txt">y</span>
          </div>

          <div class="pre-splash-subtitle">ACADEMIC INTELLIGENCE</div>

          <div class="pre-splash-bar">
            <div class="pre-splash-bar-inner"></div>
          </div>
          <span class="pre-splash-status">جاري التحقق من الجلسة ومزامنة البيانات...</span>
        </div>

        <div class="pre-splash-footer-wrap">
          <div class="pre-splash-dev-sep">
            <div class="pre-splash-dev-line"></div>
            <span>DEVELOPED BY</span>
            <div class="pre-splash-dev-line"></div>
          </div>
          <div class="pre-splash-pill" dir="ltr">
            <div class="dev-item-mt">
              <div class="avatar-badge avatar-mt">MT</div>
              <span class="dev-name">Eng Mostafa Tag</span>
            </div>
            <div class="dev-divider"></div>
            <div class="dev-item-am">
              <div class="avatar-badge avatar-am">AM</div>
              <span class="dev-name">Eng Abdelrahman Mahmoud</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
